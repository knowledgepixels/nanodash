name: Maven Test & Coverage upload

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# One run per branch or pull request: pushing again makes the run already going obsolete, and
# the tests still make enough calls to the public nanopub services that overlapping runs are
# worth avoiding (issue #809).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distribution: [ "temurin" ]
        java: [ "21" , "23", "25" ]
    name: Testing with Java ${{ matrix.java }} (${{ matrix.distribution }})
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Test with Maven
        run: ./mvnw -B test

      - name: Send coverage to Coveralls (parallel)
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          parallel: true
          flag-name: run-${{ join(matrix.*, '-') }}
          # Coverage upload is best-effort: a Coveralls outage must not fail the build.
          fail-on-error: false

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          parallel-finished: true
          fail-on-error: false

name: Live corpus tests

# The tests tagged "live" read the live nanopub corpus: AllAssertionTemplatesLoadingTest alone
# fetches 195 templates and everything they point at. That is worth checking, but not on every
# push and pull request across three Java versions and four test JVMs each -- that much traffic
# overloaded the public query services (issue #809). Once a day, on one Java version, in one
# JVM, is enough to notice a template that stopped loading.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: 'maven'

      - name: Run the live tests
        run: ./mvnw -B test -Dgroups=live -Dtest.excludedGroups= -Dtest.forkCount=1

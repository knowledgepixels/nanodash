<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">

<head>
  <link rel="stylesheet" href="../../../../../webapp/style.css?for-local-testing-only" type="text/css" media="screen"
        title="Stylesheet"/>
</head>
<body style="margin-left: auto; margin-right: auto; max-width: 1420px">

<wicket:panel>
  <div class="paneltitlerow listpanel">
    <h4 wicket:id="label">Network</h4>
    <span wicket:id="refresh-indicator" class="refresh-spinner" title="Updating..."></span>
    <span class="buttons"><wicket:container wicket:id="np">[np]</wicket:container></span>
    <span wicket:id="buttons" class="buttons"></span>
  </div>
  <p wicket:id="description" class="view-description">description</p>
  <div wicket:id="network-container">
    <script type="application/json" class="network-view-data" wicket:id="graph-data">{}</script>
  </div>
  <p wicket:id="legend-row" class="network-view-legend"><wicket:container wicket:id="legend"><span
      class="network-view-legend-entry"><span wicket:id="swatch" class="network-view-swatch"></span><span
      wicket:id="type">[type]</span></span></wicket:container></p>
  <p wicket:id="truncation-note" class="network-view-note">[note]</p>
  <p wicket:id="no-records" class="no-records-note">(nothing found)</p>
</wicket:panel>

</body>

</html>
